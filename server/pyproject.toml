[project]
name = "unity-mcp"
version = "0.1.0"
description = "MCP server for Unity Editor integration"
requires-python = ">=3.11"
# Upper bounds on every major version: a new major release can remove APIs
# (mcp 2.0 renamed FastMCP), so it is adopted deliberately, not by accident.
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27.0,<1",
    "pydantic>=2.12.0,<3",
    "uvicorn>=0.31.1,<1",   # required for --transport sse / streamable-http
]

[project.scripts]
# Entry point: "uv run unity-mcp" launches the server
unity-mcp = "unity_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unity_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",     # HTTP mocking for httpx — keeps tests hermetic
]
